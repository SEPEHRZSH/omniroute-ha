<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="title desc">
  <title id="title">OmniRoute HA architecture</title>
  <desc id="desc">Clients connect to HAProxy, which routes traffic to the ready active OmniRoute instance. The standby is promoted on failover. Both instances access MongoDB for shared state, ownership and fencing, and Redis Sentinel for cache invalidation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172b4d}.main{font-size:17px;font-weight:650}.sub{font-size:12px;fill:#475569}.label{font-size:11px;font-weight:600;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect x="1" y="1" width="878" height="438" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <g text-anchor="middle">
    <rect x="350" y="19" width="180" height="43" rx="9" fill="#fff" stroke="#cbd5e1"/>
    <text x="440" y="46" class="main">API clients</text>
    <path d="M440 62V84" class="line" marker-end="url(#arrow)"/>
    <rect x="316" y="87" width="248" height="56" rx="10" fill="#e0e7ff" stroke="#818cf8"/>
    <text x="440" y="110" class="main">HAProxy</text>
    <text x="440" y="129" class="sub">Stable endpoint · /readyz</text>
    <path d="M440 143V162H230V191" fill="none" stroke="#15803d" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#green)"/>
    <path d="M440 162H650V191" class="line" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="329" y="156" class="label" style="fill:#166534">Live traffic</text>
    <text x="551" y="156" class="label">On promotion</text>
    <rect x="82" y="194" width="296" height="75" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="230" y="218" class="main">OmniRoute A</text>
    <text x="230" y="239" font-size="11" font-weight="700" fill="#166534" style="fill:#166534">ACTIVE</text>
    <text x="230" y="255" class="sub">HA adapter · worker bridge</text>
    <rect x="502" y="194" width="296" height="75" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="218" class="main">OmniRoute B</text>
    <text x="650" y="239" font-size="11" font-weight="700" fill="#475569" style="fill:#475569">STANDBY</text>
    <text x="650" y="255" class="sub">HA adapter · worker bridge</text>
    <path d="M230 269V300H650V269" class="line"/>
    <rect x="336" y="288" width="208" height="24" rx="12" fill="#f8fafc"/>
    <text x="440" y="304" class="label">Shared backend access</text>
    <path d="M230 300V337" class="line" marker-end="url(#arrow)"/>
    <path d="M650 300V337" class="line" marker-end="url(#arrow)"/>
    <rect x="82" y="340" width="296" height="62" rx="10" fill="#ecfdf5" stroke="#34a77e"/>
    <text x="230" y="364" class="main">MongoDB Replica Set</text>
    <text x="230" y="384" class="sub">Durable state · lease · fencing epoch</text>
    <rect x="502" y="340" width="296" height="62" rx="10" fill="#fff1f2" stroke="#e78a8e"/>
    <text x="650" y="364" class="main">Redis / Sentinel</text>
    <text x="650" y="384" class="sub">Cache invalidation · reconnection</text>
    <text x="440" y="424" class="sub">Illustrative roles: either instance can become the active owner.</text>
  </g>
</svg>
