# Render distinct application addresses for the two backends.
# Terminate client TLS at HAProxy or at the upstream gateway.
global
    maxconn 2048

defaults
    mode http
    timeout connect 3s
    timeout check 2s
    timeout client 5m
    timeout server 5m
    retries 0

frontend omniroute
    bind :8080
    acl private_health path -i /ha/status /livez /readyz
    http-request deny deny_status 403 if private_health
    default_backend omniroute_hosts

backend omniroute_hosts
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host omniroute
    http-check expect status 200
    server primary "${OMNI_PRIMARY}" check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server standby "${OMNI_STANDBY}" check inter 1s fall 2 rise 1 backup on-marked-down shutdown-sessions
